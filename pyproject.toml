[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jerald"
version = "0.0.1"
description = "A statistical regression harness for AI agents"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "jsonschema>=4.20",
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
jerald = "jerald.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jerald"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
